# Konfigurace kontrol T8 (GitHub Actions, guilda Git, CI/CD a governance).
# Jeden soubor pro obě kontroly: názvy tabulek a povinné sekce README.
# Změny tohoto souboru jdou přes Pull Request a schvaluje je guilda.

[tables]
# Kde hledat definice Fabric položek (složka propojená s workspace).
scan_dir = "fabric"

# Povolené prefixy podle vrstvy. bronze_ a silver_ jsou ze zadání guildy.
# log_ je návrh pro technické tabulky (log běhů); o jeho přijetí rozhoduje guilda.
allowed_prefixes = ["bronze_", "silver_", "log_"]

# Celý název tabulky: jen malá písmena, číslice a podtržítka.
name_pattern = "^[a-z][a-z0-9_]*$"

# true = i název, který nejde ověřit staticky (např. saveAsTable(promenna)), shodí kontrolu.
# false = takový případ je jen varování.
strict = false

[readme]
path = "README.md"

# Minimální počet znaků obsahu pod nadpisem (bez podnadpisů a mezer),
# aby sekce nebyla jen prázdný nadpis.
min_content_chars = 40

# Slova, která v sekci znamenají „ještě není hotové“.
placeholders = ["todo", "tbd", "doplnit", "doplnime", "doplníme", "lorem ipsum"]

# Povinné sekce. Sekce je splněná, když nějaký nadpis (# až ######) obsahuje
# alespoň jedno z klíčových slov. Porovnává se bez diakritiky a velikosti písmen,
# slovo musí začínat na začátku slova („licenc“ najde „Licence“ i „licencí“).
# level = "error" shodí kontrolu, "warning" jen upozorní (sekce pro pozdější milníky).
# Seznam je potřeba sladit se šablonou README od T7.

[[readme.sections]]
id = "tym"
title = "Tým a role"
keywords = ["tym", "team", "role", "clenove"]
level = "error"
source = "Zadání: Organizace týmu a role"

[[readme.sections]]
id = "architektura"
title = "Architektura a struktura workspace"
keywords = ["architektur", "struktur", "workspace"]
level = "error"
source = "Zadání: výstupy role Tech lead (architektonický diagram, README)"

